<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>halo — The P3 palette kit</title>
<meta name="description" content="halo is the P3 palette kit, crafted for screens.">
<meta name="theme-color" content="#151517">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root {
    --bg: #151517;
    --bg-2: #1b1b1e;
    --ink: #ededed;
    --muted: #a1a1a1;
    --dim: #6e6e73;
    --line: rgba(255, 255, 255, .12);
    --chip: rgba(255, 255, 255, .04);
    --gutter: clamp(16px, 2.6vw, 28px);
    --sans: "Geist", ui-sans-serif, system-ui, sans-serif;
    --serif: "Newsreader", "Times New Roman", serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid #fff; outline-offset: 3px; border-radius: 6px; }

  /* ---------- hero ---------- */
  .hero {
    position: relative;
    min-height: 100vh;
    min-height: 100svh;
    isolation: isolate;
    overflow: hidden;
    background: var(--bg);
  }
  .stage {
    position: absolute; inset: 0;
    z-index: -1;
    touch-action: pan-y;
  }
  .stage canvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    display: block;
  }
  #fx { mix-blend-mode: screen; }

  /* ---------- nav ---------- */
  .nav {
    position: relative; z-index: 2;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px var(--gutter);
    height: 64px;
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand-mark { width: 22px; height: 22px; display: block; }
  .brand-slash { color: var(--dim); font-size: 22px; font-weight: 300; transform: translateY(-1px); }
  .brand-name { font-family: var(--serif); font-size: 24px; font-weight: 400; letter-spacing: -.01em; line-height: 1; }
  .links { display: flex; gap: 20px; margin-left: 12px; }
  .links a { font-size: 14px; color: var(--muted); transition: color .2s; }
  .links a:hover { color: var(--ink); }
  .right { display: flex; align-items: center; gap: 8px; }
  .search {
    display: flex; align-items: center; justify-content: space-between; gap: 28px;
    height: 36px; padding: 0 6px 0 12px; min-width: 172px;
    border: 1px solid var(--line); border-radius: 8px;
    background: var(--chip);
    font-size: 14px; color: var(--muted);
    transition: border-color .2s, color .2s;
  }
  .search:hover { border-color: rgba(255,255,255,.22); color: var(--ink); }
  kbd {
    font-family: var(--sans); font-size: 11px; color: var(--muted);
    border: 1px solid var(--line); border-radius: 5px;
    padding: 2px 5px; background: rgba(255,255,255,.03);
  }
  .ask {
    height: 36px; padding: 0 12px;
    border: 1px solid var(--line); border-radius: 8px;
    font-size: 14px; font-weight: 500;
    background: var(--chip);
    transition: background .2s, border-color .2s;
  }
  .ask:hover { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.22); }
  .icon-btn { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 8px; color: var(--ink); transition: background .2s; }
  .icon-btn:hover { background: rgba(255,255,255,.06); }
  .menu { display: none; }

  /* ---------- copy ---------- */
  .copy {
    position: relative; z-index: 1;
    min-height: calc(100svh - 64px);
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 var(--gutter) 64px;
    max-width: 560px;
    pointer-events: none;
  }
  .copy > * { pointer-events: auto; }
  .wordmark {
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(72px, 8.6vw, 124px);
    line-height: .9;
    letter-spacing: -.035em;
    font-variation-settings: "opsz" 72;
    margin-bottom: clamp(14px, 1.8vw, 22px);
  }
  .lede {
    font-size: clamp(28px, 3.05vw, 44px);
    line-height: 1.2;
    font-weight: 400;
    letter-spacing: -.025em;
    margin-bottom: clamp(24px, 2.6vw, 36px);
  }
  .lede span { display: block; }

  .tabs { display: flex; align-items: center; gap: 8px; font-size: 15px; margin-bottom: 14px; }
  .tab { color: var(--dim); padding: 2px 0; transition: color .2s; }
  .tab:hover { color: var(--muted); }
  .tab[aria-selected="true"] { color: var(--ink); }
  .dot { color: var(--dim); font-size: 11px; }

  .cmd {
    position: relative;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    max-width: 440px;
    padding-top: 14px;
    font-size: 15px; line-height: 1.5;
    color: var(--ink);
  }
  .cmd::before {
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 1px;
    background: linear-gradient(90deg, rgba(255,255,255,.28), rgba(255,255,255,.08) 70%, transparent);
  }
  .cmd-text { transition: opacity .18s, transform .18s; }
  .cmd-text.swap { opacity: 0; transform: translateY(3px); }
  .copy-btn {
    flex: none; width: 30px; height: 30px; display: grid; place-items: center;
    border-radius: 7px; color: var(--dim);
    transition: color .2s, background .2s;
  }
  .copy-btn:hover { color: var(--ink); background: rgba(255,255,255,.06); }
  .copy-btn .ok { display: none; }
  .copy-btn.done .ok { display: block; }
  .copy-btn.done .cp { display: none; }

  /* load-in */
  .rise { opacity: 0; transform: translateY(12px); animation: rise .9s cubic-bezier(.2,.7,.2,1) forwards; }
  .rise:nth-child(2) { animation-delay: .08s; }
  .rise:nth-child(3) { animation-delay: .16s; }
  .rise:nth-child(4) { animation-delay: .24s; }
  @keyframes rise { to { opacity: 1; transform: none; } }
  .stage { opacity: 0; animation: fade 1.6s .2s ease forwards; }
  @keyframes fade { to { opacity: 1; } }

  /* ---------- responsive ---------- */
  @media (max-width: 960px) {
    .search { min-width: 0; gap: 14px; }
  }
  @media (max-width: 820px) {
    .links, .search, .ask { display: none; }
    .menu { display: grid; }
    .copy {
      justify-content: flex-start;
      min-height: 0;
      padding-top: clamp(28px, 7svh, 64px);
      padding-bottom: 0;
      max-width: 100%;
    }
    .hero { min-height: max(100svh, 720px); }
  }
  @media (max-width: 420px) {
    .tabs { font-size: 14px; gap: 6px; }
    .cmd { font-size: 14px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .rise, .stage { animation: none; opacity: 1; transform: none; }
  }
</style>

<script>
/* ---------- tabs + copy ---------- */
(() => {
  const tabs = document.querySelectorAll('.tab');
  const cmd = document.getElementById('cmd');
  const copy = document.getElementById('copy');
  tabs.forEach(t => t.addEventListener('click', () => {
    tabs.forEach(o => o.setAttribute('aria-selected', o === t));
    cmd.classList.add('swap');
    setTimeout(() => { cmd.textContent = t.dataset.cmd; cmd.classList.remove('swap'); }, 160);
  }));
  copy.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(cmd.textContent); } catch (e) {}
    copy.classList.add('done');
    setTimeout(() => copy.classList.remove('done'), 1400);
  });
})();

</script>

<script type="module">
/* ---------- prism + light ----------
   Glass prism ported from vercel-labs/vgpu (MIT License, Copyright (c) Vercel, Inc.)
   apps/docs/app/[lang]/(home)/components/prism-background:
   - scene/prism-mesh.ts          rounded-prism mesh (fillet on all nine edges)
   - shared/glass/glass.wgsl      front interface: refraction to the exit face, Beer-Lambert
                                  absorption, Fresnel studio reflection, HDR panel highlight
   - shared/glass/glass-back.wgsl back interface: inner reflection with total internal reflection
   - environment/environment.wgsl the three-panel studio the glass reflects
   - runtime/interaction.ts, scene/camera.ts, types.ts (lamp arc, camera orbit, constants)
   Rewritten from WGSL/WebGPU to GLSL/three.js for this standalone page.

   The light is 2D ray optics on the plane through the middle of the glass:
   Snell's law at every face, Fresnel reflect/transmit split, total internal reflection,
   and Cauchy dispersion n(λ) = A + B/λ², drawn with a soft bloom. That light image is the
   "scene" the glass refracts, exactly as in the original pipeline. */
import * as THREE from 'three';

const stage = document.querySelector('.stage');
const glCv = document.getElementById('gl');
const fx = document.getElementById('fx');
const ctx = fx.getContext('2d');
const bc = document.createElement('canvas');
const bx = bc.getContext('2d');
const sm = document.createElement('canvas'), smx = sm.getContext('2d');
const CAN_FILTER = (() => { const t = document.createElement('canvas').getContext('2d'); t.filter = 'blur(2px)'; return t.filter === 'blur(2px)'; })();
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const q = new URLSearchParams(location.search);

/* ---- constants from vgpu types.ts (their scene units: prism side 0.57) ---- */
const UNIT_SIDE = 0.57;
const DEPTH_RATIO = 0.3 / UNIT_SIDE;          // PRISM_DEPTH / PRISM_SIDE
const FILLET_RATIO = 0.008 / UNIT_SIDE;       // PRISM_BEVEL_RADIUS / PRISM_SIDE
const CORNER_SEGMENTS = 4, BEVEL_SEGMENTS = 4, EDGE_SEGMENTS = 16;
const CAMERA_FOV = 48, CAMERA_ORBIT_DEG = 3.5, CAMERA_ORBIT_LERP = 0.08, LAMP_AIM_LERP = 0.12;
const INCIDENCE = { top: -35, mid: 60, bottom: 75 };   // DEFAULT_BEAM_MOUSE_Y_CONTROLS + PRISM_INCIDENCE_DEGREES
const GLASS = { ior: 1.645, absorption: [1, 1, 0.54], reflectionStrength: 2.14, exposure: 2.3 }; // dark theme
const AUTO_POINTER_PERIOD = 18, AUTO_POINTER_RADIUS = 0.34;

/* ---- spectrum: their default "stylized" Cauchy glass, base 1.2, strength 0.1 ---- */
const CAUCHY_A = 1.2, CAUCHY_B = 0.1;
function spectral(l) {
  let r = 0, g = 0, b = 0;
  if (l < 440) { r = -(l - 440) / 60 * .6; b = 1; }
  else if (l < 490) { g = (l - 440) / 50; b = 1; }
  else if (l < 510) { g = 1; b = -(l - 510) / 20; }
  else if (l < 580) { r = (l - 510) / 70; g = 1; }
  else if (l < 645) { r = 1; g = -(l - 645) / 65; }
  else { r = 1; }
  return [r, g, b];
}
const N = 72;
const SPECTRUM = (() => {
  const raw = [];
  for (let i = 0; i < N; i++) {
    const l = 410 + (285 * i) / (N - 1);
    raw.push({ l, n: CAUCHY_A + CAUCHY_B / Math.pow(l / 1000, 2), c: spectral(l) });
  }
  // white balance: all wavelengths together sum to white
  const sum = [0, 0, 0];
  raw.forEach(s => s.c.forEach((x, k) => sum[k] += x));
  return raw.map(s => {
    const bal = s.c.map((x, k) => x / sum[k]);
    const m = Math.max(...bal);
    return {
      n: s.n,
      vivid: s.c.map(x => Math.round(x * 255)).join(','),
      rgb: bal.map(x => Math.round((x / m) * 255)).join(','),
      w: m,
    };
  });
})();

/* ---- vector helpers ---- */
const v = (x, y) => ({ x, y });
const sub = (a, b) => v(a.x - b.x, a.y - b.y);
const add = (a, b) => v(a.x + b.x, a.y + b.y);
const mul = (a, s) => v(a.x * s, a.y * s);
const dot = (a, b) => a.x * b.x + a.y * b.y;
const norm = a => { const l = Math.hypot(a.x, a.y) || 1; return v(a.x / l, a.y / l); };
const lerp = (a, b, t) => a + (b - a) * t;
const lerpV = (a, b, t) => v(lerp(a.x, b.x, t), lerp(a.y, b.y, t));
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const rad = d => d * Math.PI / 180;

/* ---- state ---- */
// "plane" coordinates are CSS pixels on the light plane (the middle of the glass); at the
// resting camera they coincide with the screen.
let W = 0, H = 0, dpr = 1, mobile = false, S = 0, far = 0;
let center = v(0, 0), tri = [], edges = [];
const fixedPtr = q.has('px') ? [clamp(+q.get('px'), 0, 1), clamp(+q.get('py') || .5, 0, 1)] : null;
let aimTarget = [0.5, 0.5], aim = [0.5, 0.5];      // [height -> incidence, width -> point of impact]
let orbitTarget = [0, 0], orbit = [0, 0];
let lastPointer = -1e9;

/* ---- three.js glass ---- */
const GLSL_COMMON = /* glsl */`
  vec3 srgbToLinear(vec3 c) { return mix(c / 12.92, pow((c + 0.055) / 1.055, vec3(2.4)), step(0.04045, c)); }
  vec3 linearToSrgb(vec3 c) { c = max(c, 0.0); return mix(c * 12.92, 1.055 * pow(c, vec3(1.0 / 2.4)) - 0.055, step(0.0031308, c)); }

  // environment.wgsl: a dark room, back-left wall, soft fill below and a cool right key.
  float panelMask(vec3 dir, vec3 pdir, vec2 size, float feather) {
    vec3 f = normalize(pdir);
    vec3 helper = abs(f.y) > 0.92 ? vec3(0.0, 0.0, 1.0) : vec3(0.0, 1.0, 0.0);
    vec3 r = normalize(cross(helper, f));
    vec3 u = cross(f, r);
    float facing = dot(dir, f);
    if (facing <= 0.01) return 0.0;
    float lx = abs(dot(dir, r) / facing);
    float ly = abs(dot(dir, u) / facing);
    return (1.0 - smoothstep(size.x, size.x + feather, lx)) * (1.0 - smoothstep(size.y, size.y + feather, ly));
  }
  vec3 studio(vec3 dIn) {
    vec3 d = normalize(dIn);
    float floorBlend = 1.0 - smoothstep(-0.22, -0.02, d.y);
    vec3 room = mix(vec3(0.00025, 0.0003, 0.0004), vec3(0.006, 0.007, 0.009), floorBlend);
    float negativeZ = 1.0 - smoothstep(-0.08, 0.08, d.z);
    float aboveFloor = smoothstep(-0.28, -0.08, d.y);
    room = mix(room, vec3(0.00002), negativeZ * aboveFloor);
    float horizon = exp(-abs(d.y + 0.1) * 22.0) * 0.0012;
    vec3 c = room + vec3(horizon, horizon * 0.96, horizon * 0.9);
    c += vec3(0.82, 0.84, 0.88) * panelMask(d, vec3(-0.82, 0.08, 0.57), vec2(1.35, 1.1), 0.22) * 0.011;
    c += vec3(1.0, 0.97, 0.91) * panelMask(d, vec3(0.0, -0.707, 0.707), vec2(0.38, 0.62), 0.18) * 0.22;
    c += vec3(0.76, 0.88, 1.0) * panelMask(d, vec3(0.612, 0.354, 0.707), vec2(0.5, 0.16), 0.035) * 20.0;
    vec3 mapped = c / (vec3(1.0) + c);
    return srgbToLinear(pow(max(mapped, vec3(0.0)), vec3(1.0 / 2.2))) * uExposure;
  }
  float dielectricFresnel(float f0, float facing) {
    float m = 1.0 - clamp(facing, 0.0, 1.0);
    float m2 = m * m;
    return f0 + (1.0 - f0) * m2 * m2 * m;
  }
`;

const GLASS_VERT = /* glsl */`
  varying vec3 vPos;
  varying vec3 vNormal;
  void main() {
    vec4 world = modelMatrix * vec4(position, 1.0);
    vPos = world.xyz;
    vNormal = normalize(mat3(modelMatrix) * normal);
    gl_Position = projectionMatrix * viewMatrix * world;
  }
`;

const GLASS_UNIFORMS = `
  uniform vec4 uPlanes[5];   // AB, BC, CA, front, back as (outward normal, offset)
  uniform float uIor;
  uniform float uF0;
  uniform float uReflection;
  uniform float uExposure;
  uniform float uLimit;      // anything farther than this is a miss
  uniform float uEps;
  varying vec3 vPos;
  varying vec3 vNormal;
`;

// glass.wgsl — the outer/front interface
const FRONT_FRAG = /* glsl */`
  ${GLASS_UNIFORMS}
  uniform sampler2D uScene;
  uniform vec2 uResolution;
  uniform vec3 uAbsorption;
  uniform mat4 uViewProj;
  ${GLSL_COMMON}
  float planeExit(vec3 o, vec3 d, vec4 p) {
    float den = dot(p.xyz, d);
    if (den <= 0.00001) return 1e9;
    float t = (p.w - dot(p.xyz, o)) / den;
    return t > uEps * 0.5 ? t : 1e9;
  }
  void main() {
    vec3 n = normalize(vNormal);
    vec3 view = normalize(cameraPosition - vPos);
    vec3 incident = -view;
    float facing = clamp(dot(view, n), 0.0, 1.0);
    vec3 reflectedEnv = studio(reflect(incident, n));
    float fresnel = dielectricFresnel(uF0, facing);

    // follow the refracted ray to the face it actually leaves through
    vec3 inside = normalize(refract(incident, n, 1.0 / uIor));
    vec3 origin = vPos + inside * uEps;
    float t = 1e9;
    for (int i = 0; i < 5; i++) t = min(t, planeExit(origin, inside, uPlanes[i]));
    bool valid = t < uLimit;
    vec2 uv = gl_FragCoord.xy / uResolution;
    if (valid) {
      vec4 clip = uViewProj * vec4(origin + inside * t, 1.0);
      uv = clip.xy / max(clip.w, 0.00001) * 0.5 + 0.5;
    }
    vec2 half_ = 0.5 / uResolution;
    vec3 background = texture2D(uScene, clamp(uv, half_, 1.0 - half_)).rgb;
    vec3 transmitted = valid ? background * exp(-uAbsorption * t) : vec3(0.0);
    vec3 reflected = reflectedEnv * uReflection;
    float grazing = pow(1.0 - facing, 1.5);

    // bright studio panels keep a visible footprint even on the frontal face
    float lum = dot(reflectedEnv, vec3(0.2126, 0.7152, 0.0722));
    float panel = smoothstep(0.5, 0.82, lum);
    vec3 physical = transmitted * (1.0 - fresnel) + reflected * fresnel;

    const end = [corner[0] + toNext[0] * tangentDistance, corner[1] + toNext[1] * tangentDistance];

  const srcS = toScreen(src), inEnd = toScreen(inEndPlane);
  bx.strokeStyle = 'rgba(255,255,255,.3)'; bx.lineWidth = 12 * bw;
  bx.beginPath(); bx.moveTo(srcS.x, srcS.y); bx.lineTo(inEnd.x, inEnd.y); bx.stroke();
  bx.strokeStyle = 'rgba(255,255,255,1)'; bx.lineWidth = 4.5 * bw;
  bx.stroke();

  // dust catching the beam
  const perp = v(-d.y, d.x);
  motes.forEach(m => {
    m.t = (m.t + m.sp * dt * .06) % 1;
    const along = 1 - Math.pow(m.t, 1.8) * .85;
    const p = toScreen(add(lerpV(src, inEndPlane, along), mul(perp, m.off * (10 + 26 * (1 - along)))));
    if (p.x < -10 || p.y < -10 || p.x > W + 10 || p.y > H + 10) return;
    const tw = .3 + .7 * Math.abs(Math.sin(now * .0018 + m.ph));
    bx.fillStyle = `rgba(255,255,255,${.75 * tw})`;
    bx.beginPath(); bx.arc(p.x, p.y, m.r, 0, 6.2832); bx.fill();
  });

  // spectral bands: fill between neighbouring wavelengths -> continuous spectrum
  const hits = [];
  groups.forEach(list => {
    for (let i = 0; i < N; i++) {
      const a = list[i], b = list[i + 1];
      if (!a) continue;
      // white core: every wavelength's ray, white-balanced, sums back to white where they overlap
      bx.strokeStyle = `rgba(${SPECTRUM[i].rgb},${Math.min(1, SPECTRUM[i].w * a.I * 2.2)})`;
      bx.lineWidth = a.open ? 3.4 * bw : 4 * bw;
      bx.beginPath(); bx.moveTo(a.a.x, a.a.y); bx.lineTo(a.b.x, a.b.y); bx.stroke();
      if (i === 0 && !a.open && a.I > .15) hits.push({ p: a.hitPt, e: a.hit, I: a.I });
      if (!b) continue;
      const alpha = Math.min(1, a.I * (a.open ? .78 : .5));
      let fill = `rgba(${SPECTRUM[i].vivid},${alpha})`;
      if (a.open) {
        const g = bx.createLinearGradient(a.a.x, a.a.y, a.b.x, a.b.y);
        g.addColorStop(0, `rgba(${SPECTRUM[i].vivid},${alpha})`);
        g.addColorStop(.3, `rgba(${SPECTRUM[i].vivid},${alpha * .75})`);
        g.addColorStop(.7, `rgba(${SPECTRUM[i].vivid},${alpha * .25})`);
        g.addColorStop(1, `rgba(${SPECTRUM[i].vivid},0)`);
        fill = g;
      }
      bx.fillStyle = fill;
      bx.beginPath();
      bx.moveTo(a.a.x, a.a.y); bx.lineTo(a.b.x, a.b.y); bx.lineTo(b.b.x, b.b.y); bx.lineTo(b.a.x, b.a.y);
      bx.closePath(); bx.fill();
    }
  });

  // the glass edge lights up where the beam crosses it
  const glint = (pPlane, ei, k) => {
    if (ei < 0 || !pPlane) return;
    const e = edges[ei], p = toScreen(pPlane), ea = toScreen(e.a), eb = toScreen(e.b), L = S * .2;
    const g = bx.createRadialGradient(p.x, p.y, 0, p.x, p.y, L);
    g.addColorStop(0, `rgba(255,255,255,${k})`); g.addColorStop(1, 'rgba(255,255,255,0)');
    bx.strokeStyle = g; bx.lineWidth = 2;
    bx.beginPath(); bx.moveTo(ea.x, ea.y); bx.lineTo(eb.x, eb.y); bx.stroke();
    bx.fillStyle = `rgba(255,255,255,${k})`;
    bx.beginPath(); bx.arc(p.x, p.y, 2.6, 0, 6.2832); bx.fill();
  };
  glint(entry, entryEdge, 1);
  hits.forEach(h => glint(h.p, h.e, Math.min(1, h.I)));

  /* composite with bloom */
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, fx.width, fx.height);
  ctx.globalCompositeOperation = 'lighter';
  if (CAN_FILTER) {
    ctx.filter = `blur(${Math.round(34 * s)}px)`; ctx.globalAlpha = .6; ctx.drawImage(bc, 0, 0);
    ctx.filter = `blur(${Math.round(12 * s)}px)`; ctx.globalAlpha = .9; ctx.drawImage(bc, 0, 0);
    ctx.filter = `blur(${(3.2 * s).toFixed(1)}px)`; ctx.globalAlpha = 1; ctx.drawImage(bc, 0, 0);
    ctx.filter = 'none';
  } else {
    // no canvas filters (older Safari): blur by drawing through small buffers and scaling back up
    ctx.imageSmoothingEnabled = true;
    [[16, .6], [6, .9], [2, 1]].forEach(([k, a]) => {
      const w = Math.max(1, Math.round(bc.width / k)), h = Math.max(1, Math.round(bc.height / k));
      if (sm.width !== w || sm.height !== h) { sm.width = w; sm.height = h; }
      smx.clearRect(0, 0, w, h); smx.drawImage(bc, 0, 0, w, h);
      ctx.globalAlpha = a; ctx.drawImage(sm, 0, 0, fx.width, fx.height);
    });
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';

  /* glass: scene (page + light) -> back interface over it -> screen -> front interface refracting it */
  if (renderer) {
    lightTex.needsUpdate = true;
    renderer.setRenderTarget(rt);
    renderer.clear();
    renderer.render(sceneBg, camera);
    renderer.render(sceneBack, camera);
    renderer.setRenderTarget(null);
    renderer.clear();
    renderer.render(sceneCopy, camera);
    renderer.render(sceneFront, camera);
  }

  requestAnimationFrame(frame);
}

/* ---- interaction.ts: height swings the lamp, width picks the point of impact,
   and hovering tilts only the camera ---- */
function setNormalizedPointer([x, y], withOrbit = true) {
  x = clamp(x, 0, 1); y = clamp(y, 0, 1);
  aimTarget = [y, x];
  if (withOrbit) orbitTarget = [x * 2 - 1, y * 2 - 1];
}
function onPointer(cx, cy) {
  const r = stage.getBoundingClientRect();
  if (r.width <= 0 || r.height <= 0) return;
  lastPointer = performance.now();
  setNormalizedPointer([(cx - r.left) / r.width, (cy - r.top) / r.height], !mobile);
}
window.addEventListener('pointermove', ev => { if (ev.isPrimary !== false) onPointer(ev.clientX, ev.clientY); }, { passive: true });
window.addEventListener('pointerdown', ev => onPointer(ev.clientX, ev.clientY), { passive: true });
window.addEventListener('touchmove', ev => { const t = ev.touches[0]; if (t) onPointer(t.clientX, t.clientY); }, { passive: true });
document.documentElement.addEventListener('mouseleave', () => { orbitTarget = [0, 0]; });

let resizeTimer;
window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(layout, 60); });
if (document.fonts) document.fonts.ready.then(layout);
layout();
requestAnimationFrame(frame);
</script>
</body>
</html>
